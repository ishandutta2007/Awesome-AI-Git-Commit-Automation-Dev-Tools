<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.15); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes beamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: -200; }
      }
      .floating-orb-1 {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .floating-orb-2 {
        animation: pulseOrb 10s ease-in-out infinite alternate;
        transform-origin: 1000px 300px;
      }
      .wire-flow {
        stroke-dasharray: 8 12;
        animation: dashMove 14s linear infinite;
      }
      .active-beam {
        stroke-dasharray: 60 140;
        animation: beamFlow 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .card-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="floating-orb-1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#glowCyan)" opacity="0.3" />
  <circle class="floating-orb-2" cx="980" cy="280" r="160" fill="#a855f7" filter="url(#glowPurple)" opacity="0.3" />

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Animated Git Workflow Branch Lines (Behind Text) -->
  <g opacity="0.45">
    <path class="wire-flow" d="M 80 340 C 260 340, 280 230, 420 230 S 680 230, 840 230 S 960 340, 1120 340" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="active-beam" d="M 80 340 C 260 340, 280 230, 420 230 S 680 230, 840 230 S 960 340, 1120 340" fill="none" stroke="#38bdf8" stroke-width="3" />
    
    <path class="wire-flow" d="M 80 340 C 350 340, 450 340, 600 340 S 850 340, 1120 340" fill="none" stroke="#334155" stroke-width="2" />
    <circle cx="280" cy="230" r="5" fill="#38bdf8" />
    <circle cx="600" cy="230" r="5" fill="#818cf8" />
    <circle cx="920" cy="230" r="5" fill="#c084fc" />
  </g>

  <!-- High-Tech Glass Card Framing the Foreground Content -->
  <g class="card-float" transform="translate(0, 0)">
    <rect x="90" y="45" width="1020" height="330" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Header Pill / Category Badge -->
    <rect x="420" y="70" width="360" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      ⚡ THE MODERN GIT WORKFLOW ECOSYSTEM
    </text>

    <!-- Main Title in Foreground -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-1">
      AI Git Commit Automation
    </text>

    <!-- Subtitle in Foreground -->
    <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9" text-anchor="middle">
      Curated List of SaaS Platforms &amp; Open-Source Developer Tools
    </text>

    <!-- Feature Highlights Tagline -->
    <text x="600" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Conventional Commits • AI PR Reviews • Stacked Diffs • Git Hooks &amp; AST Linters • Agentic CLI
    </text>

    <!-- Interactive Style Feature Pills -->
    <g transform="translate(180, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="36" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        ✨ 1-Click AI Commits
      </text>

      <!-- Pill 2 -->
      <rect x="215" y="0" width="190" height="36" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="310" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        🤖 Automated PR Reviews
      </text>

      <!-- Pill 3 -->
      <rect x="435" y="0" width="190" height="36" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="530" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        📚 Stacked Diffs &amp; TUIs
      </text>

      <!-- Pill 4 -->
      <rect x="655" y="0" width="185" height="36" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="747" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        🛡️ Secret Scanners &amp; CI
      </text>
    </g>
  </g>
</svg>
